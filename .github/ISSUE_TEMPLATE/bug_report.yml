name: Bug report
description: Report a reproducible UMR problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a UMR issue. Please fill out the details below and inspect logs for private filesystem/user-name information before attaching them.
  - type: input
    id: umr_version
    attributes:
      label: UMR version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: starsector_version
    attributes:
      label: Starsector version
      placeholder: "0.98a-RC8"
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Relevant mod list
      description: Include versions when practical.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: UMR settings / CSV changes
      description: Describe changes to settings.json, blacklist, overrides, or third-party CSVs. Say "none" if unchanged.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: weapon
    attributes:
      label: Affected weapon / source mod
      description: Exact weapon ID is especially useful when known.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach UniversalMissileRegeneration.log and starsector.log when possible. SUMMARY is usually sufficient; VERBOSE is useful for weapon-specific issues.
  - type: checkboxes
    id: privacy
    attributes:
      label: Log privacy
      options:
        - label: I inspected attached logs for filesystem/user-name information I do not want to share.
          required: true
