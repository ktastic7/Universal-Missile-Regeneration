name: Field telemetry / data contribution
description: Contribute UMR data from a large or interesting mod set
title: "[Telemetry] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping broaden UMR compatibility coverage. VERBOSE is preferred for weapon-level field data; SUMMARY is still useful for broad session health.
  - type: input
    id: umr_version
    attributes:
      label: UMR version
    validations:
      required: true
  - type: input
    id: starsector_version
    attributes:
      label: Starsector version
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mod set / relevant mods
      description: Full list is welcome for a large stack; otherwise list the missile-heavy or relevant mods.
    validations:
      required: true
  - type: dropdown
    id: logging
    attributes:
      label: UMR logging level
      options:
        - VERBOSE
        - SUMMARY
        - TRACE
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: Session description
      description: Approximate number/type of campaign or simulation battles and anything notable.
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Visible issue or proactive data?
      description: Say whether you noticed a problem or are contributing logs with no visible bug.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach UniversalMissileRegeneration.log and starsector.log.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Log privacy
      options:
        - label: I inspected attached logs for filesystem/user-name information I do not want to share.
          required: true
